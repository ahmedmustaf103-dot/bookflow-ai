# Optional. Local/CI can use this instead of embedded-postgres.
#   docker compose -f docker-compose.test.yml up -d
#   BOOKFLOW_TEST_DATABASE_URL=postgresql://bookflow:bookflow@127.0.0.1:54329/bookflow_test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bookflow
      POSTGRES_PASSWORD: bookflow
      POSTGRES_DB: bookflow_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookflow -d bookflow_test"]
      interval: 5s
      timeout: 5s
      retries: 10
