name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint · Test · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://user:pass@localhost:5432/bookflow
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          CLERK_WEBHOOK_SIGNING_SECRET: whsec_ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://user:pass@localhost:5432/bookflow
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Smoke + accessibility tests
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://user:pass@localhost:5432/bookflow
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run test:e2e
